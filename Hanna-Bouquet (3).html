<style>
:root{color-scheme:light;--ink:#3d2932;--muted:#8e737b;--rose:#bd6f86;--rose-dark:#97516b;--paper:#fffdfa;--line:#eadbd8;--green:#59745e;--lav:#8b7aab}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 12% 8%,#f7e4e4 0,transparent 33%),radial-gradient(ellipse at 90% 80%,#e8e7ee 0,transparent 34%),#fbf5f1;overflow-x:hidden}button{font:inherit}button:focus-visible{outline:3px solid #9b6ea0;outline-offset:4px}.page{width:min(100% - 28px,1000px);margin:auto;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 0 22px}.top-mark{display:flex;align-items:center;gap:9px;color:#967b82;font-size:.77rem;letter-spacing:.06em;margin-bottom:18px}.top-mark:before,.top-mark:after{content:"";height:1px;width:28px;background:#d6b5b9}.panel{width:100%;max-width:820px;border:1px solid rgba(210,176,178,.54);background:rgba(255,253,250,.86);box-shadow:0 24px 80px rgba(104,63,76,.09),0 3px 10px rgba(104,63,76,.04);border-radius:26px;overflow:hidden;position:relative}.panel:before{content:"";position:absolute;inset:10px;border:1px solid rgba(223,193,190,.48);border-radius:19px;pointer-events:none}.intro{padding:42px 25px 27px;text-align:center}.eyebrow{font-size:.8rem;color:var(--rose-dark);letter-spacing:.03em;margin:0 0 12px}.intro h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(1.75rem,5vw,3.2rem);line-height:1.45;margin:0 auto;max-width:720px;letter-spacing:-.035em}.intro p{color:var(--muted);font-size:.99rem;line-height:1.9;margin:10px 0 18px}.art-wrap{position:relative;width:min(100%,500px);margin:0 auto;z-index:1}.art-wrap svg,.art-wrap .embedded-bouquet-svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 15px 15px rgba(104,63,76,.07))}.open-btn,.primary-btn{border:0;color:white;background:linear-gradient(135deg,#c47b91,#a95b76);border-radius:999px;padding:14px 26px;box-shadow:0 7px 18px rgba(169,91,118,.23);cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;font-size:.92rem;min-height:48px}.open-btn:hover,.primary-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(169,91,118,.3)}.caption{font-size:.76rem;color:#a48a90;margin:15px 0 1px}.footer{text-align:center;font-size:.74rem;color:#a79095;padding:15px 10px 4px}.bouquet-screen{display:none;padding:20px 20px 28px;text-align:center}.screen-heading{margin:4px 0;color:var(--rose-dark);font-size:.84rem;font-weight:400}.screen-title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.5rem,4vw,2.15rem);font-weight:500;margin:7px 0 5px;line-height:1.55}.screen-subtitle{color:var(--muted);font-size:.88rem;line-height:1.8;margin:0 0 4px}.interactive-art{position:relative;width:min(100%,500px);margin:0 auto}.interactive-art .art-wrap{width:100%;pointer-events:none}.hotspot{position:absolute;z-index:3;width:48px;height:48px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.93);border-radius:50%;background:rgba(255,250,247,.4);box-shadow:0 0 0 4px rgba(255,250,247,.2);cursor:pointer;display:grid;place-items:center;transition:transform .2s,background .2s}.hotspot:before{content:"";width:8px;height:8px;background:#fff8f6;border-radius:50%;box-shadow:0 0 0 4px rgba(177,99,127,.3)}.hotspot:hover,.hotspot:focus-visible{transform:translate(-50%,-50%) scale(1.13);background:rgba(255,255,255,.8)}.hotspot.done{background:#617d67;border:2px solid white}.hotspot.done:before{content:"✓";background:transparent;box-shadow:none;color:white;font-size:1rem;width:auto;height:auto}.hotspot span{position:absolute;inset:auto auto calc(100% + 5px) 50%;transform:translateX(50%);white-space:nowrap;background:#fffdfa;border:1px solid var(--line);padding:4px 8px;border-radius:8px;color:#7b5a65;font-size:.65rem;opacity:0;pointer-events:none;transition:opacity .2s}.hotspot:focus-visible span,.hotspot:hover span{opacity:1}.progress{display:flex;justify-content:center;align-items:center;gap:9px;margin:0 auto 15px;color:#856b73;font-size:.83rem}.progress-line{width:130px;height:5px;border-radius:20px;background:#efe4e1;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#c88b9d,#7b9a7f);border-radius:20px;transition:width .3s}.below-note{font-size:.79rem;color:#a08b91;line-height:1.8;margin:6px 0 0}.finish-row{padding-top:14px}.finish-btn{display:none;border:1px solid #d7b2ba;background:#fff8f7;color:#92516b;padding:11px 20px;border-radius:999px;cursor:pointer;min-height:44px}.modal-backdrop{position:fixed;z-index:20;inset:0;background:rgba(47,32,41,.43);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px}.modal{width:min(100%,510px);background:#fffdfa;border:1px solid #ead7d7;box-shadow:0 24px 90px rgba(45,23,35,.25);border-radius:24px;padding:27px 24px 21px;position:relative;animation:rise .25s ease;max-height:min(88vh,780px);overflow:auto}.close{position:absolute;top:12px;left:12px;width:38px;height:38px;border-radius:50%;border:1px solid #efdfdd;background:#fff8f6;color:#7f5c66;font-size:1.3rem;cursor:pointer}.modal-kicker{text-align:center;color:var(--rose-dark);font-size:.76rem;margin:8px 0}.modal h2{text-align:center;font-weight:500;font-family:Georgia,"Times New Roman",serif;font-size:1.65rem;line-height:1.5;margin:6px 0 16px}.modal-message{white-space:pre-wrap;overflow-wrap:anywhere;font-size:1rem;line-height:2.2;text-align:center;color:#59434b;margin:0 auto;max-width:420px}.modal-symbol{display:flex;justify-content:center;margin:8px 0 15px;color:#b67889;font-size:1.3rem}.modal-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #f0e4e1;margin-top:22px;padding-top:16px}.text-btn{border:0;background:transparent;color:#916a77;padding:9px 10px;cursor:pointer;min-height:40px}.text-btn:disabled{opacity:.28;cursor:default}.next-btn{border:1px solid #e2c4c9;background:#fff6f7;color:#96556d;border-radius:999px;padding:10px 16px;cursor:pointer;min-height:42px}.letter{display:none;text-align:center;padding:35px 26px 33px;animation:rise .4s ease}.letter-ornament{font-size:1.4rem;color:#bc7f90;margin-bottom:13px}.letter h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.6rem,4vw,2.25rem);font-weight:500;line-height:1.5;margin:0 0 21px}.letter-body{white-space:pre-wrap;overflow-wrap:anywhere;text-align:justify;text-align-last:center;font-size:1rem;line-height:2.25;color:#57414b;max-width:610px;margin:0 auto}.signature{font-family:Georgia,"Times New Roman",serif;font-size:1.3rem;color:#a55d77;margin:22px 0 24px}.letter-small{color:#b09a9e;font-size:.76rem;line-height:1.8}.restart{border:1px solid #e6ced1;background:transparent;color:#9a7180;border-radius:999px;padding:10px 16px;margin-top:18px;cursor:pointer}.sprinkle{position:absolute;pointer-events:none;opacity:.45;color:#ba8491;font-size:14px}.s1{top:25px;left:25px}.s2{right:22px;bottom:26px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:540px){.page{width:min(100% - 18px,1000px);padding:14px 0}.top-mark{margin-bottom:12px}.panel{border-radius:20px}.panel:before{inset:7px;border-radius:14px}.intro{padding:30px 17px 19px}.intro p{font-size:.91rem}.art-wrap{width:min(100%,380px)}.bouquet-screen{padding:17px 10px 23px}.interactive-art{width:min(100%,410px)}.hotspot{width:40px;height:40px}.hotspot:before{width:7px;height:7px}.progress-line{width:90px}.modal{padding:25px 18px 16px}.modal h2{font-size:1.45rem}.modal-message{font-size:.96rem;line-height:2}.letter{padding:30px 18px 27px}.letter-body{font-size:.94rem;line-height:2.15}.footer{padding-top:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<body>
<main class="page"><div class="top-mark" aria-hidden="true">یک یادگاری کوچک</div><div class="panel" id="panel">
<section class="intro" id="intro"><p class="eyebrow" id="eyebrow"></p><h1 id="intro-title"></h1><p id="intro-subtitle"></p><div class="art-wrap" id="cover-art"><img class="embedded-bouquet-svg" alt="دسته‌گلی با رزهای صورتی، گل‌های سفید، لاله و اسطوخودوس"></div><button class="open-btn" id="open-btn" type="button"></button><p class="caption">هفت گل، هفت حرف نگفته</p><span class="sprinkle s1" aria-hidden="true">✦</span><span class="sprinkle s2" aria-hidden="true">✿</span></section>
<section class="bouquet-screen" id="bouquet-screen" aria-labelledby="screen-title"><p class="screen-heading">برای تو، دونه‌دونه</p><h2 class="screen-title" id="screen-title">هر گل، یه حرف کوچیک</h2><p class="screen-subtitle">روی گل‌ها بزن تا حرف‌های پنهانشون رو بخونی.</p><div class="interactive-art"><div class="art-wrap" id="interactive-art"><img class="embedded-bouquet-svg" alt="دسته‌گلی با رزهای صورتی، گل‌های سفید، لاله و اسطوخودوس"></div>
<button class="hotspot" data-flower="pink-rose" style="left:35%;top:27%" aria-label="خواندن پیام رز صورتی"><span>رز صورتی</span></button><button class="hotspot" data-flower="white-flower" style="left:50%;top:20%" aria-label="خواندن پیام گل سفید"><span>گل سفید</span></button><button class="hotspot" data-flower="tulip" style="left:68%;top:31%" aria-label="خواندن پیام لاله"><span>لاله</span></button><button class="hotspot" data-flower="lavender" style="left:26%;top:31%" aria-label="خواندن پیام اسطوخودوس"><span>اسطوخودوس</span></button><button class="hotspot" data-flower="small-blossom" style="left:49%;top:39%" aria-label="خواندن پیام شکوفهٔ کوچک"><span>شکوفهٔ کوچک</span></button><button class="hotspot" data-flower="jasmine" style="left:61%;top:43%" aria-label="خواندن پیام یاس"><span>یاس</span></button><button class="hotspot" data-flower="ribbon" style="left:50%;top:65%" aria-label="خواندن پیام روبان آخر"><span>روبان آخر</span></button></div>
<div class="progress" aria-live="polite"><span id="progress-label">شکوفه‌ها: ۰ از ۷</span><span class="progress-line" aria-hidden="true"><span class="progress-fill" id="progress-fill"></span></span></div><p class="below-note">برای خوندن هر پیام، گلش رو لمس کن 🤍</p><div class="finish-row"><button class="finish-btn" id="finish-btn" type="button">یه حرف دیگه مونده برات</button></div></section>
<section class="letter" id="letter" aria-labelledby="letter-title"><div class="letter-ornament" aria-hidden="true">✧　❀　✧</div><h2 id="letter-title"></h2><p class="letter-body" id="letter-body"></p><p class="signature" id="signature"></p><p class="letter-small">لازم نیست چیزی رو همین لحظه جواب بدی. این هدیه فقط برای توئه. 🤍</p><button class="restart" id="restart" type="button">از اول دیدن دسته‌گل</button></section>
</div><footer class="footer">با حوصله ساخته شده، فقط برای هانا 🤍</footer></main>
<div class="modal-backdrop" id="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message"><button class="close" id="close-modal" type="button" aria-label="بستن پیام">×</button><p class="modal-kicker" id="modal-kicker"></p><div class="modal-symbol" aria-hidden="true">✿</div><h2 id="modal-title"></h2><p class="modal-message" id="modal-message"></p><div class="modal-actions"><button class="text-btn" id="prev-flower" type="button">گل قبلی</button><button class="next-btn" id="next-flower" type="button">گل بعدی ←</button></div></section></div>
<script>
'use strict';
const DATA = {"introEyebrow":"یک دسته گل ، برای زیباترین دسته گل جهان","introTitle":"برای تک ستاره درخشانم","introSubtitle":"امیدوارم این گل ها بتونن لبخند رو به روی لبای زیبات بیارن :)","introButton":"بزن روی من تا دسته گل ات باز شه ...","flowers":[{"id":"pink-rose","name":"رز صورتی","kind":"گل اول","message":"برای اون لبخندای ماهت که میتونن روز منو بسازن و اون انرژیی که توی خانومم وجود داره و میدونه چطوری میتونه یه نفر رو  ( که قطعا منم ) دوست داشته باشه 💞"},{"id":"white-flower","name":"گل سفید","kind":"گل دوم","message":"واسه اینکه میدونم خیلی اذیت میکنم و ناراحت میکنم دخترمو ولی بازم میخوام بدونه که هیچ چیزی باعث نمیشه دست از دوست داشتنش بردارم 🌼"},{"id":"tulip","name":"لاله","kind":"گل سوم","message":"برای وصف کردن تک تک تار های موهات و اون چشمای خوشگلت . شایدم باید یکم بی ادب شم و برای وصف بدن جذاب و هاتت هم استفادش کنم ارهههه ؟ 🐾 "},{"id":"lavender","name":"اسطوخودوس","kind":"گل چهارم","message":"امیدوارم اگر ناراحتت کرده باشم واقعا حاضر باشی من رو ببخشی و بوسم کنییی 3: 🌠"},{"id":"small-blossom","name":"شکوفهٔ کوچک","kind":"گل پنجم","message":"میدونستی که روز های من فقط با یه دلیل روشن میشن و اون چیزی نیست جز تو ؟  پس میشه همیشه تنها دلیل روشن زندگی من بمونی ؟ یا کی میدونه ؟ شایدم تنها ستاره ی درخشان من باشی ؟ 🫀"},{"id":"jasmine","name":"یاس","kind":"گل ششم","message":"برای اینکه بهت بگم تو زیباترین انتخاب من هستی و اگر هزار بار برگردیم به شبی که بهت اعتراف کردم ، بازم اینکارو میکنم و تا وقتی که اشکات رو با دستام پاک کنم ، بهت میگم عاشقتم 😻"},{"id":"ribbon","name":"روبان آخر","kind":"گل هفتم","message":"میدونم در حد گل های واقعی نیست ولی بازم این دسته گل رو با تمام وجودم به بهترین دختر و مامانی که دارم تقدیم میکنم 3: \nتو تنها رویای منیا خوشگل بلا ❤️‍🔥"}],"letterTitle":"یه بوسه بر اون دستای ظریفت 💋","letterBody":"هانای خوشگل من ، تنها فرشته ی زندگی من 🪶\n\n قطعا اگر یه نفر بهم بگه حاضری برای یک روز دوستش نداشته باشی و همه ثروتای جهان رو بدیم بهت ، با مشت میزنم توی صورت طرف و میگم من اون پیچ و تاب زلفش و اون لب های زیبا اش رو با یک دنیا هم عوض نمیکنم .\n\n تو زیباترین شاخه گلی هستی که میتونم چه توی گذشته و چه تو حال و حتی آینده ، توی دستام بگیرم و هروقت بو اش کنم ، اون راحیه اش رو از دست نداده باشه و بتونه دوباره منو زنده کنه :)\n\nدوست دارم تا اخرین لحظه ای که نفس میکشم بتونم در آغوش بگیرمت و خداروشکر کنم که چنین دوست دختر زیبا و ماهیو دارم . امیدوارم منو با همه بدی هایی که دارم همچنان دوست داشته باشی و منو به عنوان یه همدم واسه زندگیت پذیرفته باشی و بزاری دستاتو همیشه توی دستام بگیرم و نزارم لحظه ای سرما رو حس کنن . \n\nو این رو هم بدون که همونقدر که جهان هستی بزرگه ، عشق منم بهت به همون اندازه بزرگه و مدام در حال بیشتر شدنه . چه از لحظه ای باشه که بیدار میشم و چه از ثانیه ای باشه که باهات خدافظی میکنم و میری بخوابی . \n\nببخشید که با وجود پریود بودنت و حال بد ات انقد بهت فشار اوردم و ناراحتت کردم . ولی اینو بدون که خیلی عاشق زیباییتم و همش بخاطر اینه که دوست دارم در هر ثانیه ای ببینمت . در عین حال هم میخوام بدونی که من توی پریودی و این دوران حساس بودنت ، دستمو از دور کمرت ول نمیکنما 3:\n\nخب دیگه امیدوارم این حرفا واسه اینکه پسری که از صمیم دلش عاشقته رو ببخشی ، یه بوسه خیلی قویییی به اون لبای سرخ تر از رز ات 💞\n\nبا تمام وجودم عاشقتم دخترم ","signature":"با عشق، عرفان"};

const FLOWER_POSITIONS = {'pink-rose':[35,27],'white-flower':[50,20],'tulip':[68,31],'lavender':[26,42],'small-blossom':[49,39],'jasmine':[61,43],'ribbon':[50,65]};
const $ = id => document.getElementById(id);document.querySelectorAll('.embedded-bouquet-svg').forEach(img=>{img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(SVG_SOURCE);});const keys=DATA.flowers.map(f=>f.id);let opened=new Set();let activeIndex=0;let lastFocus=null;
function loadProgress(){try{const value=JSON.parse(localStorage.getItem('hanna-bouquet-progress-v1')||'[]');if(Array.isArray(value))opened=new Set(value.filter(x=>keys.includes(x)));}catch{opened=new Set();}updateProgress();}
function saveProgress(){try{localStorage.setItem('hanna-bouquet-progress-v1',JSON.stringify([...opened]));}catch{}}
function updateProgress(){const count=opened.size;$('progress-label').textContent=`شکوفه‌ها: ${String(count).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[Number(d)])} از ۷`;$('progress-fill').style.width=`${count/7*100}%`;document.querySelectorAll('.hotspot').forEach(b=>b.classList.toggle('done',opened.has(b.dataset.flower)));$('finish-btn').style.display=count===7?'inline-block':'none';}
function showBouquet(){ $('intro').style.display='none';$('bouquet-screen').style.display='block';$('letter').style.display='none';$('bouquet-screen').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});}
function openFlower(id,focusElement){const idx=DATA.flowers.findIndex(f=>f.id===id);if(idx<0)return;activeIndex=idx;lastFocus=focusElement||document.querySelector(`[data-flower="${id}"]`);showFlowerModal();}
function showFlowerModal(){const flower=DATA.flowers[activeIndex];opened.add(flower.id);saveProgress();updateProgress();$('modal-kicker').textContent=`${flower.kind} از هفت گل`;$('modal-title').textContent=flower.name;$('modal-message').textContent=flower.message;$('prev-flower').disabled=activeIndex===0;$('next-flower').textContent=activeIndex===6?'بستن پیام':'گل بعدی ←';$('modal-backdrop').style.display='flex';document.body.style.overflow='hidden';$('close-modal').focus();}
function closeModal(){ $('modal-backdrop').style.display='none';document.body.style.overflow='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
function goNext(){if(activeIndex<6){activeIndex++;showFlowerModal();}else closeModal();}function goPrev(){if(activeIndex>0){activeIndex--;showFlowerModal();}}
function showLetter(){closeModal();$('intro').style.display='none';$('bouquet-screen').style.display='none';$('letter-title').textContent=DATA.letterTitle;$('letter-body').textContent=DATA.letterBody;$('signature').textContent=DATA.signature;$('letter').style.display='block';$('letter').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});}
function restart(){opened.clear();saveProgress();updateProgress();$('letter').style.display='none';$('bouquet-screen').style.display='none';$('intro').style.display='block';window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
$('eyebrow').textContent=DATA.introEyebrow;$('intro-title').textContent=DATA.introTitle;$('intro-subtitle').textContent=DATA.introSubtitle;$('open-btn').textContent=DATA.introButton;
$('open-btn').addEventListener('click',showBouquet);document.querySelectorAll('.hotspot').forEach(b=>b.addEventListener('click',()=>openFlower(b.dataset.flower,b)));$('close-modal').addEventListener('click',closeModal);$('next-flower').addEventListener('click',goNext);$('prev-flower').addEventListener('click',goPrev);$('finish-btn').addEventListener('click',showLetter);$('restart').addEventListener('click',restart);$('modal-backdrop').addEventListener('click',e=>{if(e.target===$('modal-backdrop'))closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal-backdrop').style.display==='flex')closeModal();if($('modal-backdrop').style.display==='flex'&&e.key==='ArrowRight')goNext();if($('modal-backdrop').style.display==='flex'&&e.key==='ArrowLeft')goPrev();});loadProgress();
</script></body></html>
